name: Release Candidate CI (No Production Access)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://release-ci.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: release-ci-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: npm

      # This PR workflow has read-only repository permission and no environment secrets.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Install Chromium for browser-backed unit tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: npm run test:release-guards
