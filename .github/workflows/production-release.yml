name: Production Release

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Read-only migration audit or unaliased deployment staging"
        required: true
        type: choice
        options:
          - migration_audit
          - stage_deployment
      commit_sha:
        description: "Exact 40-character commit SHA already present on main"
        required: true
        type: string
      migration_gate:
        description: "For staging only: enter MIGRATIONS_REVIEWED after separate approval"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.check.outputs.commit_sha }}
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Validate release identity
        id: check
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
          RELEASE_PHASE: ${{ inputs.phase }}
          MIGRATION_GATE: ${{ inputs.migration_gate }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid release SHA' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || { echo 'Checkout SHA mismatch' >&2; exit 1; }
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$RELEASE_SHA" ]] || { echo 'Release SHA is not current main' >&2; exit 1; }
          if [[ "$RELEASE_PHASE" == stage_deployment && "$MIGRATION_GATE" != MIGRATIONS_REVIEWED ]]; then
            echo 'Migration review gate is required before staging' >&2
            exit 1
          fi
          echo "commit_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  migration_audit:
    if: ${{ inputs.phase == 'migration_audit' }}
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          persist-credentials: false
      - name: Validate Production project ref
        run: |
          set -euo pipefail
          [[ "$SUPABASE_PROJECT_REF" == yahocagtrxvevqhhlkln ]] || { echo 'Production Supabase ref mismatch' >&2; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Inspect migration history and dry run only
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --linked
          supabase db push --linked --dry-run

  stage_deployment:
    if: ${{ inputs.phase == 'stage_deployment' }}
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      CI: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          persist-credentials: false
      - name: Validate Vercel target
        run: |
          set -euo pipefail
          [[ "$VERCEL_ORG_ID" == team_yoQ8LjFAuDbIECvokuYnyerC ]] || { echo 'Vercel team mismatch' >&2; exit 1; }
          [[ "$VERCEL_PROJECT_ID" == prj_sD0qAEQHEKYsvCeQBjb0lWJWgGiG ]] || { echo 'Vercel project mismatch' >&2; exit 1; }
          [[ -n "$VERCEL_TOKEN" ]] || { echo 'Vercel token missing' >&2; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@63.1.0
      - name: Confirm domain auto-assignment is disabled before staging
        run: |
          set -euo pipefail
          vercel api "/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" --method GET > project.json
          node -e 'const p=require("./project.json"); if (p.autoAssignCustomDomains !== false || p.link?.productionBranch !== "main") process.exit(1)'
          rm project.json
      - name: Pull Production build configuration
        run: vercel pull --yes --environment=production
      - name: Build unaliased Production artifact
        run: vercel build --prod
      - name: Stage without assigning Production domains
        run: vercel deploy --prebuilt --prod --skip-domain

# Migration application, domain promotion, and release announcement are separate,
# explicitly approved operations. This workflow never performs them implicitly.
