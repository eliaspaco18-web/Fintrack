name: Production Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref a publicar"
        required: true
        default: "main"
      apply_migrations:
        description: "Aplicar migraciones de Supabase"
        required: true
        default: true
        type: boolean
      deploy_vercel:
        description: "Desplegar en Vercel Producción"
        required: true
        default: true
        type: boolean

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    env:
      CI: true
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Validate release configuration
        run: |
          set -euo pipefail

          missing=""
          for key in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!key:-}" ]; then
              missing="$missing $key"
            fi
          done

          if [ -n "$missing" ]; then
            echo "Faltan variables o secretos de release:$missing" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Playwright
        run: npx playwright install --with-deps chromium

      - name: Pull Vercel project settings
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Pull Vercel production env
        run: npx vercel env pull .env.local --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Smoke E2E
        run: npm run test:e2e -- tests/e2e/login-ui.spec.ts tests/e2e/auth-redirect.spec.ts

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        if: ${{ inputs.apply_migrations }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push Supabase migrations
        if: ${{ inputs.apply_migrations }}
        run: supabase db push --linked --include-all

      - name: Build Vercel artifact
        if: ${{ inputs.deploy_vercel }}
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel Production
        if: ${{ inputs.deploy_vercel }}
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
