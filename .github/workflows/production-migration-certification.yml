name: Certify Existing Production Migrations (Read Only)

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact V3 commit on main to certify without applying SQL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fintrack-production-migrations
  cancel-in-progress: false

jobs:
  certify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-migrations
    env:
      EXPECTED_PRODUCTION_PROJECT_REF: yahocagtrxvevqhhlkln
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      MIGRATIONS_ENABLED: ${{ vars.FINTRACK_PRODUCTION_MIGRATIONS_ENABLED }}
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Check out exact reviewed V3 release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fail closed unless authorization, project, and exact main SHA match
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          [[ "$(git rev-parse origin/main)" == "$RELEASE_SHA" ]]
          [[ "$MIGRATIONS_ENABLED" == "1" ]]
          [[ "$PRODUCTION_SUPABASE_PROJECT_REF" == "$EXPECTED_PRODUCTION_PROJECT_REF" ]]

      - name: Verify pinned Supabase CLI (read only)
        run: npx --yes supabase@2.120.0 --version

      - name: Link only to verified Production database
        run: npx --yes supabase@2.120.0 link --project-ref "$PRODUCTION_SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Certify all 37 local and remote migrations match (NO db push)
        run: |
          set -euo pipefail
          npx --yes supabase@2.120.0 migration list --linked 2>&1 | tee "$RUNNER_TEMP/fintrack-migration-ledger.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { assertCompleteMigrationLedger } from './scripts/release/assert-migration-ledger.mjs'
          const ledger = fs.readFileSync(`${process.env.RUNNER_TEMP}/fintrack-migration-ledger.txt`, 'utf8')
          const ids = assertCompleteMigrationLedger(ledger, 37)
          process.stdout.write(`PASS: ${ids.length} synchronized migration versions, including all V3 IDs.\n`)
          NODE
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Record protected read-only migration certification
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fintrack-migration-evidence"
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const evidence = {
            release_sha: process.env.RELEASE_SHA,
            migrations: ['20261025000001', '20261025000002', '20261026000001'],
            result: 'supabase-ledger-certified',
            certification: 'protected-production-migration-ledger',
            observed_migration_count: 37,
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/fintrack-migration-evidence/evidence.json`, JSON.stringify(evidence, null, 2))
          NODE
          node scripts/release/assert-migration-evidence.mjs "$RUNNER_TEMP/fintrack-migration-evidence/evidence.json" "$RELEASE_SHA"

      - name: Retain certification evidence for protected V3 staging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fintrack-production-migration-evidence
          path: ${{ runner.temp }}/fintrack-migration-evidence/evidence.json
          retention-days: 7
