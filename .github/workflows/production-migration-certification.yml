name: Certify Production Migration Ledger (Read Only)

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact code-only commit on main to certify without applying SQL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fintrack-production-migration-certification
  cancel-in-progress: false

jobs:
  certify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-migrations
    env:
      EXPECTED_PRODUCTION_PROJECT_REF: yahocagtrxvevqhhlkln
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      MIGRATIONS_ENABLED: ${{ vars.FINTRACK_PRODUCTION_MIGRATIONS_ENABLED }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1

      - name: Verify exact current main SHA, project and explicit gate
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          [[ "$GITHUB_SHA" == "$RELEASE_SHA" ]]
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$RELEASE_SHA" ]]
          [[ "$MIGRATIONS_ENABLED" == "1" ]]
          [[ "$PRODUCTION_SUPABASE_PROJECT_REF" == "$EXPECTED_PRODUCTION_PROJECT_REF" ]]

      - name: Resolve active official Production deployment baseline (read only)
        id: baseline
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/release/production-baseline.mjs

      - name: Classify all changes since active Production and reject non-additive migrations
        id: classify
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PRODUCTION_BASE_SHA" "$RELEASE_SHA"
          git -c diff.renames=false diff --name-status "$PRODUCTION_BASE_SHA" "$RELEASE_SHA" > "$RUNNER_TEMP/release-changes.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { execFileSync } from 'node:child_process'
          import { classifyReleaseFiles, assertMigrationChangesAreAdditive } from './scripts/release/continuous-publishing.mjs'
          import { migrationIdsFromPaths } from './scripts/release/assert-migration-ledger.mjs'
          const changes = fs.readFileSync(`${process.env.RUNNER_TEMP}/release-changes.txt`, 'utf8').trim().split(/\r?\n/).filter(Boolean).map(line => {
            const [status, ...parts] = line.split(/\s+/)
            return { status, path: parts.at(-1) }
          })
          const classification = classifyReleaseFiles(changes.map(change => change.path))
          assertMigrationChangesAreAdditive(changes)
          if (classification.changeType === 'migration' && classification.migrationIds.length === 0) throw new Error('Supabase configuration or unversioned SQL changes require a separately reviewed protected procedure.')
          const migrationIds = migrationIdsFromPaths(changes.map(change => change.path))
          const treeSha = execFileSync('git', ['rev-parse', `${process.env.RELEASE_SHA}^{tree}`], { encoding: 'utf8' }).trim()
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `change_type=${classification.changeType}\nrisk_level=${classification.riskLevel}\nfinancial_sensitive=${classification.financialSensitive}\ntree_sha=${treeSha}\n`)
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/release-migrations.json`, JSON.stringify({ changed: migrationIds }))
          NODE
        env:
          PRODUCTION_BASE_SHA: ${{ steps.baseline.outputs.production_base_sha }}

      - name: Reject missing or stale Production baseline
        run: |
          set -euo pipefail
          [[ "$PRODUCTION_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse "$PRODUCTION_BASE_SHA")" == "$PRODUCTION_BASE_SHA" ]]
        env:
          PRODUCTION_BASE_SHA: ${{ steps.baseline.outputs.production_base_sha }}

      - name: Install the pinned Supabase CLI
        run: npx --yes supabase@2.120.0 --version

      - name: Link the verified Production project (local link only)
        run: npx --yes supabase@2.120.0 link --project-ref "$PRODUCTION_SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Read and exactly reconcile the full migration ledger; never run db push
        run: |
          set -euo pipefail
          npx --yes supabase@2.120.0 migration list --linked 2>&1 | tee "$RUNNER_TEMP/fintrack-migration-ledger.txt"
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%P\n' | sort > "$RUNNER_TEMP/local-migration-paths.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { migrationIdsFromPaths, assertCompleteMigrationLedger } from './scripts/release/assert-migration-ledger.mjs'
          const paths = fs.readFileSync(`${process.env.RUNNER_TEMP}/local-migration-paths.txt`, 'utf8').split(/\r?\n/).filter(Boolean).map(path => `supabase/migrations/${path}`)
          const { migrationIds, ledgerSha256 } = assertCompleteMigrationLedger(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/fintrack-migration-ledger.txt`, 'utf8'),
            migrationIdsFromPaths(paths),
          )
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/verified-ledger.json`, JSON.stringify({ migrationIds, ledgerSha256 }))
          process.stdout.write(`Read-only certification matched ${migrationIds.length} local and remote migration versions. No SQL was applied.\n`)
          NODE
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Bind read-only evidence to exact SHA, tree, Production baseline, classification and ledger
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fintrack-migration-evidence"
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const ledger = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/verified-ledger.json`, 'utf8'))
          const evidence = {
            release_sha: process.env.RELEASE_SHA,
            tree_sha: process.env.RELEASE_TREE_SHA,
            production_base_sha: process.env.PRODUCTION_BASE_SHA,
            change_type: process.env.CHANGE_TYPE,
            risk_level: process.env.RISK_LEVEL,
            financial_sensitive: process.env.FINANCIAL_SENSITIVE === 'true',
            migrations: JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/release-migrations.json`, 'utf8')).changed,
            ledger_migrations: ledger.migrationIds,
            ledger_migration_count: ledger.migrationIds.length,
            ledger_sha256: ledger.ledgerSha256,
            result: 'supabase-ledger-certified',
            certification: 'protected-production-migration-ledger',
            db_push_executed: false,
            source_run_id: process.env.GITHUB_RUN_ID,
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/fintrack-migration-evidence/evidence.json`, JSON.stringify(evidence, null, 2))
          NODE
          node scripts/release/assert-migration-evidence.mjs "$RUNNER_TEMP/fintrack-migration-evidence/evidence.json" "$RELEASE_SHA" "$RELEASE_TREE_SHA" "$CHANGE_TYPE" "$PRODUCTION_BASE_SHA" "$RISK_LEVEL" "$FINANCIAL_SENSITIVE"
        env:
          RELEASE_TREE_SHA: ${{ steps.classify.outputs.tree_sha }}
          PRODUCTION_BASE_SHA: ${{ steps.baseline.outputs.production_base_sha }}
          CHANGE_TYPE: ${{ steps.classify.outputs.change_type }}
          RISK_LEVEL: ${{ steps.classify.outputs.risk_level }}
          FINANCIAL_SENSITIVE: ${{ steps.classify.outputs.financial_sensitive }}

      - name: Retain exact-SHA read-only ledger certification for Stage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fintrack-release-migration-evidence
          path: ${{ runner.temp }}/fintrack-migration-evidence/evidence.json
          retention-days: 14
