name: Apply Explicitly Approved Production Migrations

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact commit currently at main whose new migrations are reviewed
        required: true
        type: string
      apply_migrations:
        description: Explicitly authorize the verified pending migration batch
        required: true
        default: false
        type: boolean
      owner_authorized_sha:
        description: Optional exact release SHA for explicit single-owner authorization (leave blank when independently approved)
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: fintrack-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main' && inputs.apply_migrations == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-migrations
    env:
      EXPECTED_PRODUCTION_PROJECT_REF: yahocagtrxvevqhhlkln
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      MIGRATIONS_ENABLED: ${{ vars.FINTRACK_PRODUCTION_MIGRATIONS_ENABLED }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      OWNER_AUTHORIZED_SHA: ${{ inputs.owner_authorized_sha }}
      AUTHORIZED_ACTOR_ID: ${{ github.actor_id }}
    steps:
      - name: Check out the exact migration release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1

      - name: Verify exact main SHA, protected gate and Production project
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          [[ "$GITHUB_SHA" == "$RELEASE_SHA" ]]
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$RELEASE_SHA" ]]
          [[ "$MIGRATIONS_ENABLED" == "1" ]]
          [[ "$PRODUCTION_SUPABASE_PROJECT_REF" == "$EXPECTED_PRODUCTION_PROJECT_REF" ]]

      - name: Prove exact merged PR, CI and owner or independent-review authorization before database access
        id: pr-proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TREE_SHA="$(git rev-parse "$RELEASE_SHA^{tree}")" node scripts/release/continuous-publishing.mjs merged-release-proof

      - name: Resolve active official Production deployment baseline (read only)
        id: baseline
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/release/production-baseline.mjs

      - name: Classify every change since Production and verify additive migration files
        id: classify
        env:
          PRODUCTION_BASE_SHA: ${{ steps.baseline.outputs.production_base_sha }}
        run: |
          set -euo pipefail
          [[ "$PRODUCTION_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$PRODUCTION_BASE_SHA" "$RELEASE_SHA"
          git -c diff.renames=false diff --name-status "$PRODUCTION_BASE_SHA" "$RELEASE_SHA" > "$RUNNER_TEMP/release-changes.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { execFileSync } from 'node:child_process'
          import { classifyReleaseFiles, assertMigrationChangesAreAdditive } from './scripts/release/continuous-publishing.mjs'
          import { migrationIdsFromPaths } from './scripts/release/assert-migration-ledger.mjs'
          const changes = fs.readFileSync(`${process.env.RUNNER_TEMP}/release-changes.txt`, 'utf8').trim().split(/\r?\n/).filter(Boolean).map(line => {
            const [status, ...parts] = line.split(/\s+/)
            return { status, path: parts.at(-1) }
          })
          const classification = classifyReleaseFiles(changes.map(change => change.path))
          assertMigrationChangesAreAdditive(changes)
          if (classification.changeType !== 'migration' || !classification.migrationIds.length) throw new Error('Only additive, versioned SQL migrations can use this apply workflow; no-SQL releases use read-only certification.')
          const current = migrationIdsFromPaths(execFileSync('git', ['ls-tree', '-r', '--name-only', process.env.RELEASE_SHA, '--', 'supabase/migrations'], { encoding: 'utf8' }).split(/\r?\n/))
          const before = migrationIdsFromPaths(execFileSync('git', ['ls-tree', '-r', '--name-only', process.env.PRODUCTION_BASE_SHA, '--', 'supabase/migrations'], { encoding: 'utf8' }).split(/\r?\n/))
          const newSinceProduction = current.filter(id => !before.includes(id))
          if (JSON.stringify(newSinceProduction) !== JSON.stringify([...classification.migrationIds].sort())) throw new Error('Migration files since Production must be newly added and versioned. Modified/deleted migrations and Supabase config require a separately reviewed process.')
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/release-migrations.json`, JSON.stringify({ migrations: newSinceProduction, allMigrations: current }))
          const treeSha = execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim()
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tree_sha=${treeSha}\nchange_type=${classification.changeType}\nrisk_level=${classification.riskLevel}\nfinancial_sensitive=${classification.financialSensitive}\n`)
          NODE

      - name: Install the pinned Supabase CLI
        run: npx --yes supabase@2.120.0 --version

      - name: Link only the verified Production project
        run: npx --yes supabase@2.120.0 link --project-ref "$PRODUCTION_SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Derive pending versions from the read-only ledger and match the CLI dry-run
        run: |
          set -euo pipefail
          npx --yes supabase@2.120.0 migration list --linked 2>&1 | tee "$RUNNER_TEMP/migration-ledger-before.txt"
          npx --yes supabase@2.120.0 db push --linked --dry-run 2>&1 | tee "$RUNNER_TEMP/migration-dry-run.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { parseMigrationLedger, assertMigrationPlanMatchesDryRun } from './scripts/release/assert-migration-ledger.mjs'
          const manifest = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/release-migrations.json`, 'utf8'))
          const ledger = parseMigrationLedger(fs.readFileSync(`${process.env.RUNNER_TEMP}/migration-ledger-before.txt`, 'utf8'))
          const pending = ledger.localIds.filter(id => !ledger.remoteIds.includes(id))
          if (ledger.remoteIds.some(id => !manifest.allMigrations.includes(id))) throw new Error('Production ledger contains a version missing from the exact release tree.')
          if (!pending.length) throw new Error('No pending SQL remains; use read-only migration certification instead of db push.')
          if (pending.some(id => !manifest.migrations.includes(id))) throw new Error('A pending Production migration is not a newly added version since the active Production deployment.')
          assertMigrationPlanMatchesDryRun(fs.readFileSync(`${process.env.RUNNER_TEMP}/migration-dry-run.txt`, 'utf8'), pending)
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/pending-migrations.json`, JSON.stringify({ pending }))
          process.stdout.write(`Dry-run matched exactly ${pending.length} pending version(s) from the reviewed release tree.\n`)
          NODE
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Apply only the explicitly reviewed pending migration set
        run: npx --yes supabase@2.120.0 db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Verify the full local and remote ledger after apply
        run: |
          set -euo pipefail
          npx --yes supabase@2.120.0 migration list --linked 2>&1 | tee "$RUNNER_TEMP/migration-ledger-after.txt"
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%P\n' | sort > "$RUNNER_TEMP/local-migration-paths.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { migrationIdsFromPaths, assertCompleteMigrationLedger } from './scripts/release/assert-migration-ledger.mjs'
          const paths = fs.readFileSync(`${process.env.RUNNER_TEMP}/local-migration-paths.txt`, 'utf8').split(/\r?\n/).filter(Boolean).map(path => `supabase/migrations/${path}`)
          const ledger = assertCompleteMigrationLedger(fs.readFileSync(`${process.env.RUNNER_TEMP}/migration-ledger-after.txt`, 'utf8'), migrationIdsFromPaths(paths))
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/verified-ledger.json`, JSON.stringify(ledger))
          NODE
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Record exact-SHA, baseline and apply evidence
        env:
          RELEASE_TREE_SHA: ${{ steps.classify.outputs.tree_sha }}
          PRODUCTION_BASE_SHA: ${{ steps.baseline.outputs.production_base_sha }}
          CHANGE_TYPE: ${{ steps.classify.outputs.change_type }}
          RISK_LEVEL: ${{ steps.classify.outputs.risk_level }}
          FINANCIAL_SENSITIVE: ${{ steps.classify.outputs.financial_sensitive }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fintrack-migration-evidence"
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const changed = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/release-migrations.json`, 'utf8'))
          const applied = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/pending-migrations.json`, 'utf8'))
          const ledger = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/verified-ledger.json`, 'utf8'))
          const evidence = {
            release_sha: process.env.RELEASE_SHA,
            tree_sha: process.env.RELEASE_TREE_SHA,
            production_base_sha: process.env.PRODUCTION_BASE_SHA,
            change_type: process.env.CHANGE_TYPE,
            risk_level: process.env.RISK_LEVEL,
            financial_sensitive: process.env.FINANCIAL_SENSITIVE === 'true',
            migrations: changed.migrations,
            applied_migrations: applied.pending,
            ledger_migrations: ledger.migrationIds,
            ledger_migration_count: ledger.migrationIds.length,
            ledger_sha256: ledger.ledgerSha256,
            result: 'supabase-db-push-succeeded',
            db_push_executed: true,
            source_run_id: process.env.GITHUB_RUN_ID,
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/fintrack-migration-evidence/evidence.json`, JSON.stringify(evidence, null, 2))
          NODE
          node scripts/release/assert-migration-evidence.mjs "$RUNNER_TEMP/fintrack-migration-evidence/evidence.json" "$RELEASE_SHA" "$RELEASE_TREE_SHA" migration "$PRODUCTION_BASE_SHA" "$RISK_LEVEL" "$FINANCIAL_SENSITIVE"

      - name: Retain migration evidence for exact-SHA Stage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fintrack-release-migration-evidence
          path: ${{ runner.temp }}/fintrack-migration-evidence/evidence.json
          retention-days: 14
