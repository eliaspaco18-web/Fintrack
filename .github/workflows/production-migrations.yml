name: Apply Approved Production Migrations

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact migration-bearing commit already merged into main
        required: true
        type: string
      apply_migrations:
        description: Explicitly authorize the allowlisted V3 migration batch
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fintrack-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main' && inputs.apply_migrations == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-migrations
    env:
      EXPECTED_PRODUCTION_PROJECT_REF: yahocagtrxvevqhhlkln
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      MIGRATIONS_ENABLED: ${{ vars.FINTRACK_PRODUCTION_MIGRATIONS_ENABLED }}
    steps:
      - name: Check out the requested migration set
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fail closed unless project and authorization gate match
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          [[ "$MIGRATIONS_ENABLED" == "1" ]]
          [[ "$PRODUCTION_SUPABASE_PROJECT_REF" == "$EXPECTED_PRODUCTION_PROJECT_REF" ]]

      - name: Install pinned Supabase CLI
        run: |
          npm install --global supabase@2.81.3
          supabase --version

      - name: Link the verified Production project
        run: supabase link --project-ref "$PRODUCTION_SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Require exactly the reviewed V3 migrations in dry run
        run: |
          set -euo pipefail
          supabase db push --linked --dry-run 2>&1 | tee "$RUNNER_TEMP/supabase-migration-dry-run.txt"
          node scripts/release/assert-v3-migration-plan.mjs < "$RUNNER_TEMP/supabase-migration-dry-run.txt"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Apply the reviewed batch (never include all)
        run: supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Verify migration ledger after apply
        run: |
          set -euo pipefail
          supabase migration list --linked | tee "$RUNNER_TEMP/supabase-migration-ledger.txt"
          node scripts/release/assert-migration-ledger.mjs "$RUNNER_TEMP/supabase-migration-ledger.txt"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Record successful migration evidence for this exact SHA
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fintrack-migration-evidence"
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const evidence = {
            release_sha: process.env.RELEASE_SHA,
            migrations: ['20261025000001', '20261025000002', '20261026000001'],
            result: 'supabase-db-push-succeeded',
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/fintrack-migration-evidence/evidence.json`, JSON.stringify(evidence, null, 2))
          NODE

      - name: Retain migration evidence for downstream stage gate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fintrack-production-migration-evidence
          path: ${{ runner.temp }}/fintrack-migration-evidence/evidence.json
          retention-days: 7
